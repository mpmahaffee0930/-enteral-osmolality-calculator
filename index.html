<html lang="en">
<head>

<title>Enteral Osmolality Calculator v10.0</title>
<style>
:root{--teal:#0f6b78;--bg:#f4f8f8;--line:#d8e5e6;--ink:#17343a;--muted:#708387}
*{box-sizing:border-box}body{margin:0;background:#eaf3f4;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
.app{max-width:480px;min-height:100vh;margin:auto;background:var(--bg);padding-bottom:80px}
header{background:var(--teal);color:white;padding:20px;position:sticky;top:0;z-index:50}
h1{font-size:21px;margin:0}.sub{font-size:12px;opacity:.8;margin-top:3px}
main{padding:17px}.section{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted);margin:7px 2px}
.card{background:white;border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:14px}
.component{padding:13px 0;border-bottom:1px solid var(--line)}.component:last-of-type{border-bottom:0}
.label{font-size:13px;font-weight:750;margin-bottom:6px}
.searchbox{position:relative}
.searchbox input{display:block;width:100%;height:46px;border:1px solid #bfd2d4;border-radius:12px;background:#fff;padding:0 13px;font-size:16px;color:var(--ink);outline:none}
.searchbox input:focus{border-color:var(--teal);box-shadow:0 0 0 3px #dceff0}
.dropdown{touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:absolute;left:0;right:0;top:50px;background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 28px #17343a22;z-index:100;max-height:240px;overflow:auto;display:none}
.option{padding:12px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;cursor:pointer}
.option:last-child{border-bottom:0}.option small{display:block;color:var(--muted);font-weight:500;margin-top:2px}
.row{display:flex;gap:12px;align-items:center;margin-top:10px}.grow{flex:1}
.osm{font-size:12px;color:var(--teal);font-weight:800}.small{font-size:11px;color:var(--muted)}
.volume{width:105px;height:43px;border:1px solid #bfd2d4;border-radius:11px;padding:0 10px;font-size:16px}
.remove{border:0;background:none;color:#9aa; font-size:20px;padding:2px 5px}
.add{width:100%;padding:11px;border:1px dashed #9fc3c6;border-radius:11px;background:#f7fbfb;color:var(--teal);font-weight:750;margin-top:10px}
.clearall{width:100%;padding:11px;border:0;background:transparent;color:#65777b;font-weight:750;font-size:14px;margin-top:6px}.primary{width:100%;padding:14px;border:0;border-radius:12px;background:var(--teal);color:white;font-weight:800;font-size:15px}
.result{display:none}.big{font-size:40px;font-weight:850;color:var(--teal)}.unit{font-size:14px;color:var(--muted);font-weight:700}
.break{padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.break:last-child{border:0}
.dbtabs{display:flex;gap:7px;margin-bottom:12px}
.dbtab{flex:1;padding:9px 6px;border:1px solid #bfd2d4;border-radius:10px;background:#fff;color:#60777a;font-weight:800}
.dbtab.active{background:var(--teal);border-color:var(--teal);color:#fff}
.dbcount{font-size:11px;color:var(--muted);margin:8px 1px}
.dbitem{padding:11px 0;border-bottom:1px solid var(--line)}
.dbitem:last-child{border-bottom:0}
.dbname{font-size:13px;font-weight:800;color:#29494c}
.dbmeta{display:flex;justify-content:space-between;gap:10px;margin-top:4px;font-size:11px;color:var(--muted)}
.dbvalue{color:var(--teal);font-weight:800;white-space:nowrap}
.favoritehead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.savefav{width:100%;padding:11px;border:1px solid #9fc3c6;border-radius:11px;background:#f7fbfb;color:var(--teal);font-weight:800;margin-top:8px}
.favcard .favtitle{font-size:16px;font-weight:800;color:#28484b}
.favactions{display:flex;gap:8px;margin-top:12px}
.favactions button{flex:1;padding:10px 8px;border-radius:10px;font-weight:750;font-size:13px}
.loadfav{border:0;background:var(--teal);color:#fff}
.deletefav{border:1px solid #d8b8b5;background:#fff;color:#8a4a45}
.historyhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.historyclear{border:0;background:transparent;color:#8a5550;font-weight:750;font-size:13px;padding:8px}
.historycard{cursor:pointer}
.historysummary{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.historydetails{display:none;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.historycard.open .historydetails{display:block}
.historyactions{display:flex;gap:8px;margin-top:12px}
.historyactions button{flex:1;padding:10px 8px;border-radius:10px;font-weight:750;font-size:13px}
.loadhistory{border:0;background:var(--teal);color:#fff}
.deletehistory{border:1px solid #d8b8b5;background:#fff;color:#8a4a45}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:68px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:200}
nav button{flex:1;border:0;background:white;color:#829397;font-size:11px;font-weight:750}nav button.active{color:var(--teal);background:#edf7f7}
.navicon{display:block;font-size:18px;margin-bottom:2px}
.screen{display:none}.screen.active{display:block}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13px}

.volume{width:108px}
.remove{width:38px;height:38px;border-radius:50%;color:#8c9da0;font-size:21px;line-height:1}
.remove:active{background:#f1f5f5}
.add{border-color:#9dbfc3;background:#f6fbfb;padding:12px;border-radius:12px}

.primary:active,.loadhistory:active,.loadfav:active{transform:translateY(1px)}
.savefav{border-color:#a9c7ca;background:#f8fbfb;padding:12px;border-radius:12px;margin-top:10px}
.clearall{color:var(--danger);font-size:13px;margin-top:8px}

.unit{font-size:13px}
.break{padding:10px 0}
.historycard,.favcard{transition:transform .12s ease,box-shadow .12s ease}
.historycard:active,.favcard:active{transform:scale(.995)}
.historysummary{align-items:center}
.historyclear{color:var(--danger)}
.historyactions button,.favactions button{min-height:42px}
.loadhistory,.loadfav{background:var(--teal)}
.deletehistory,.deletefav{border-color:#dfc7c4;color:var(--danger);background:#fff}
.favcard .favtitle{color:var(--teal-dark)}
.dbtabs{background:#eef4f4;padding:4px;border-radius:12px;gap:3px}
.dbtab{border:0;border-radius:9px;background:transparent;min-height:38px}
.dbtab.active{box-shadow:0 2px 6px rgba(11,105,117,.15)}
.dbcount{margin:10px 2px 3px}
.dbitem{padding:13px 2px}
.dbname{font-size:13px;color:#29484d}
nav{height:76px;padding-bottom:max(5px,env(safe-area-inset-bottom));border-top-color:#dce6e7;box-shadow:0 -5px 18px rgba(24,54,59,.055)}
nav button{background:#fff;font-size:10px;letter-spacing:.01em;padding-top:6px}
nav button.active{background:#f2f9f9;color:var(--teal-dark)}
.navicon{font-size:19px;margin-bottom:3px}
.empty{padding:34px 12px}
@media (max-width:360px){main{padding-left:12px;padding-right:12px}.volume{width:98px}}
</style>
</head>

osmolality":1540.0},{"name":"Levetiracetam 100 mg/mL","osmolality":5075.0},{"name":"Linezolid 20 mg/mL","osmolality":1527.0},{"name":"Liquigen","osmolality":10.0},{"name":"Magnesium sulfate 500 mg/mL","osmolality":2300.0},{"name":"Metronidazole 50 mg/mL","osmolality":1217.0},{"name":"Nystatin 100,000 units/mL","osmolality":3590.0},{"name":"Phenobarbital","osmolality":7417.0},{"name":"Phenytoin","osmolality":3095.0},{"name":"Poly-ViSol","osmolality":10853.0},{"name":"Potassium chloride","osmolality":4225.0},{"name":"Prednisolone 3 mg/mL","osmolality":8673.0},{"name":"Propranolol 4 mg/mL","osmolality":6680.0},{"name":"Simethicone 66.7 mg/mL","osmolality":473.0},{"name":"Sodium chloride 4 mEq/mL","osmolality":7037.0},{"name":"Sodium citrate 1 mEq/mL","osmolality":1870.0},{"name":"Sodium phosphate","osmolality":5333.0},{"name":"Spironolactone 5 mg/mL","osmolality":415.0},{"name":"Sucrose 24% solution","osmolality":1603.0},{"name":"Ursodiol 50 mg/mL","osmolality":1030.0},{"name":"Zidovudine 10 mg/mL","osmolality":3663.0}]};
const state={feeds:[],meds:[],history:JSON.parse(localStorage.getItem("eo_history")||"[]"),favorites:JSON.parse(localStorage.getItem("eo_favorites")||"[]")};

function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function item(type,name){const dbKey=(type==="meds"?"medications":"feeds");return DB[dbKey].find(x=>x.name===name)}
function makeComponent(type,i,saved={}){
 const box=document.createElement("div");box.className="component";box.dataset.type=type;box.dataset.index=i;
 box.innerHTML='<div class="label">'+(type==="feeds"?"Feed ":"Medication ")+(i+1)+'</div>'+
 '<div class="searchbox"><input class="searchInput" type="text" inputmode="text" autocomplete="off" placeholder="Type to search '+(type==="feeds"?"feeds":"medications")+'..."><div class="dropdown"></div></div>'+
 '<div class="row"><div class="grow"><div class="small">Osmolality</div><div class="osm">—</div></div><div><div class="small">Volume (mL)</div><input class="volume" type="number" min="0" step="0.1" placeholder="0"></div><button class="remove" type="button">×</button></div>';
 const input=box.querySelector(".searchInput"), drop=box.querySelector(".dropdown"), osm=box.querySelector(".osm"), vol=box.querySelector(".volume");
 if(saved.name){
  box.dataset.name=saved.name; input.value=saved.name;
  const savedItem=item(type,saved.name); osm.textContent=savedItem?savedItem.osmolality+" mOsm/kg":"—";
 }else if(saved.typed){input.value=saved.typed}
 if(saved.volume!==undefined && saved.volume!==""){vol.value=saved.volume;box.dataset.volume=saved.volume}
 input.addEventListener("input",function(){
   // Manual editing invalidates any prior selection immediately.
   if(box.dataset.name && this.value !== box.dataset.name){
     box.dataset.name="";
     osm.textContent="—";
   }
   // Only the dropdown is updated, so focus/mobile keyboard behavior is preserved.
   const q=this.value.toLowerCase().trim();drop.innerHTML="";
   if(!q){drop.style.display="none";return}
   const dbKey=(type==="meds" ? "medications" : "feeds");
   const matches=DB[dbKey].filter(x=>x.name.toLowerCase().includes(q));
   matches.forEach(x=>{
     const o=document.createElement("div");o.className="option";
     o.textContent=x.name+"  •  "+x.osmolality.toFixed(1).replace(".0","")+" mOsm/kg";
     let startY=null, moved=false;
     o.addEventListener("pointerdown",function(e){
       startY=e.clientY;moved=false;
       if(e.pointerType!=="touch") e.preventDefault();
     });
     o.addEventListener("pointermove",function(e){
       if(startY!==null && Math.abs(e.clientY-startY)>8) moved=true;
     });
     o.addEventListener("pointerup",function(e){
       if(!moved){
         e.preventDefault();input.value=x.name;box.dataset.name=x.name;osm.textContent=x.osmolality.toFixed(1).replace(".0","")+" mOsm/kg";drop.style.display="none";input.blur();
       }
       startY=null;moved=false;
     });
     o.addEventListener("pointercancel",function(){startY=null;moved=false;});
     drop.appendChild(o);
   });
   drop.style.display="block";
 });
 input.addEventListener("focus",function(){if(this.value.trim())input.dispatchEvent(new Event("input"))});
 vol.addEventListener("input",function(){box.dataset.volume=this.value});
 box.querySelector(".remove").addEventListener("click",function(){removeComponent(type,i)});
 return box;
}
function addComponent(type){
 const arr=state[type], max=type==="feeds"?3:10;
 if(arr.length>=max)return;
 arr.push({});
 const host=document.getElementById(type==="feeds"?"feeds":"meds");
 const c=makeComponent(type,arr.length-1);host.appendChild(c);
 if(arr.length<max)addButton(type);
}
function addButton(type){
 const host=document.getElementById(type==="feeds"?"feeds":"meds"), old=host.querySelector(".add");
 if(old)old.remove();
 const max=type==="feeds"?3:10;
 if(state[type].length<max){
  const b=document.createElement("button");b.className="add";b.textContent="＋ Add "+(type==="feeds"?"feed":"medication");
  b.type="button";b.addEventListener("click",()=>addComponent(type));host.appendChild(b);
 }
}
function clearDisplayedResult(){
 const card=document.getElementById("result"),er=document.getElementById("error");
 card.style.display="none";card.innerHTML="";er.innerHTML="";
}
function removeComponent(type,i){
 const host=document.getElementById(type==="feeds"?"feeds":"meds");
 const current=[...host.querySelectorAll(".component")].map(c=>({
  name:c.dataset.name||"",typed:c.querySelector(".searchInput").value||"",volume:c.querySelector(".volume").value||""
 }));
 current.splice(i,1);state[type]=current.length?current:[{}];
 host.innerHTML="";
 state[type].forEach((saved,j)=>host.appendChild(makeComponent(type,j,saved)));
 addButton(type);clearDisplayedResult();
}
function clearAll(){
 ["feeds","meds"].forEach(type=>{
  state[type]=[{}];
  const host=document.getElementById(type==="feeds"?"feeds":"meds");
  host.innerHTML="";host.appendChild(makeComponent(type,0));addButton(type);
 });
 clearDisplayedResult();
}
function init(){
 ["feeds","meds"].forEach(type=>{state[type]=[{}];const host=document.getElementById(type==="feeds"?"feeds":"meds");host.appendChild(makeComponent(type,0));addButton(type)});
}
function calculate(){
 const er=document.getElementById("error"), card=document.getElementById("result");
 // A new attempt always clears the prior displayed result first.
 card.style.display="none"; card.innerHTML=""; er.innerHTML="";
 const comps=[], errors=[];
 ["feeds","meds"].forEach(type=>{
  document.querySelectorAll('.component[data-type="'+type+'"]').forEach((c,i)=>{
   const inp=c.querySelector(".searchInput"), volInp=c.querySelector(".volume");
   const typed=inp.value.trim(), name=(c.dataset.name||"").trim(), raw=volInp.value.trim();
   const label=(type==="feeds"?"Feed ":"Medication ")+(i+1);
   if(!typed && !name && raw==="") return;
   if(typed && !name){errors.push(label+": select an item from the search results.");return}
   if(!name && raw!==""){errors.push(label+": select an item for the entered volume.");return}
   if(name && raw===""){errors.push(label+" ("+name+"): enter a volume greater than 0 mL.");return}
   const v=Number(raw);
   if(!Number.isFinite(v)||v<=0){errors.push(label+" ("+name+"): volume must be greater than 0 mL.");return}
   const x=item(type,name);
   if(!x){errors.push(label+": reselect the item from the search results.");return}
   comps.push({type,name,osmolality:x.osmolality,volume:v});
  });
 });
 if(errors.length){
  er.innerHTML='<div style="padding:12px 14px;border:1px solid #e4aaa4;border-radius:12px;background:#fff3f2;color:#76241f;line-height:1.4"><b>Unable to calculate</b><br>'+errors.map(x=>'• '+esc(x)).join("<br>")+'</div>';
  return;
 }
 if(!comps.length){
  er.innerHTML='<div style="padding:12px 14px;border:1px solid #e4aaa4;border-radius:12px;background:#fff3f2;color:#76241f;line-height:1.4"><b>Unable to calculate</b><br>Add at least one feed or medication and enter a volume greater than 0 mL.</div>';
  return;
 }
 const total=comps.reduce((a,c)=>a+c.volume,0), osm=comps.reduce((a,c)=>a+c.volume*c.osmolality,0)/total;
 const r={id:Date.now(),date:new Date().toISOString(),totalVol:total,weighted:osm,components:comps};
 state.history.unshift(r);state.history=state.history.slice(0,25);localStorage.setItem("eo_history",JSON.stringify(state.history));
 card.style.display="block";
 card.innerHTML='<div class="small">TOTAL OSMOLALITY</div><div><span class="big">'+osm.toFixed(1)+'</span> <span class="unit">mOsm/kg</span></div><div class="small" style="margin-top:5px">Total volume: '+total.toFixed(2).replace(/\\.?0+$/,"")+' mL</div><div style="margin-top:13px">'+comps.map(c=>'<div class="break"><b>'+esc(c.name)+'</b> — '+c.volume+' mL × '+c.osmolality+' mOsm/kg</div>').join("")+'</div>';
}
document.addEventListener("mousedown",e=>{if(!e.target.closest(".searchbox"))document.querySelectorAll(".dropdown").forEach(d=>d.style.display="none")});
document.getElementById("calculate").addEventListener("click",calculate);
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(b.dataset.s).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(b.dataset.s==="history")renderHistory();if(b.dataset.s==="favorites")renderFavorites();if(b.dataset.s==="database")renderDB()}));
function renderHistory(){
 const e=document.getElementById("historyList");
 if(!state.history.length){e.innerHTML='<div class="card empty">No calculations yet.</div>';return}
 e.innerHTML=state.history.map((r,i)=>{
  const totalVol=(r.totalVol!==undefined?r.totalVol:r.components.reduce((s,c)=>s+Number(c.volume||0),0));
  return '<div class="card historycard" data-hi="'+i+'">'+
   '<div class="historysummary"><div><div class="small">'+new Date(r.date).toLocaleString()+'</div>'+
   '<div class="big" style="font-size:28px">'+Number(r.weighted).toFixed(1)+' <span class="unit">mOsm/kg</span></div></div>'+
   '<div class="small" style="text-align:right">'+Number(totalVol).toFixed(2).replace(/\.?0+$/,"")+' mL<br>Tap for details</div></div>'+
   '<div class="small" style="margin-top:7px">'+r.components.map(c=>esc(c.name)+" ("+c.volume+" mL)").join(" · ")+'</div>'+
   '<div class="historydetails">'+r.components.map(c=>'<div class="break"><b>'+esc(c.name)+'</b><br>'+c.volume+' mL × '+c.osmolality+' mOsm/kg</div>').join("")+
   '<div class="historyactions"><button type="button" class="loadhistory" data-load="'+i+'">Load into Calculator</button><button type="button" class="deletehistory" data-delete="'+i+'">Delete</button></div></div></div>'
 }).join("");
 e.querySelectorAll(".historycard").forEach(card=>card.addEventListener("click",ev=>{
   if(ev.target.closest("button"))return;
   card.classList.toggle("open");
 }));
 e.querySelectorAll("[data-load]").forEach(b=>b.addEventListener("click",()=>loadHistory(Number(b.dataset.load))));
 e.querySelectorAll("[data-delete]").forEach(b=>b.addEventListener("click",()=>deleteHistory(Number(b.dataset.delete))));
}
function loadHistory(i){
 const r=state.history[i]; if(!r)return;
 const feeds=r.components.filter(c=>c.type==="feeds").map(c=>({name:c.name,volume:String(c.volume)}));
 const meds=r.components.filter(c=>c.type==="meds").map(c=>({name:c.name,volume:String(c.volume)}));
 state.feeds=feeds.length?feeds:[{}]; state.meds=meds.length?meds:[{}];
 ["feeds","meds"].forEach(type=>{
   const host=document.getElementById(type);
   host.innerHTML="";
   state[type].forEach((saved,j)=>host.appendChild(makeComponent(type,j,saved)));
   addButton(type);
 });
 clearDisplayedResult();
 document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
 document.getElementById("calc").classList.add("active");
 document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.s==="calc"));
 window.scrollTo({top:0,behavior:"smooth"});
}
function deleteHistory(i){
 if(!confirm("Delete this calculation from History?"))return;
 state.history.splice(i,1);
 localStorage.setItem("eo_history",JSON.stringify(state.history));
 renderHistory();
}
function clearHistory(){
 if(!state.history.length)return;
 if(!confirm("Clear all calculation history? This cannot be undone."))return;
 state.history=[];
 localStorage.setItem("eo_history","[]");
 renderHistory();
}
function currentComponentsForFavorite(){
 const comps=[];
 ["feeds","meds"].forEach(type=>{
  document.querySelectorAll('.component[data-type="'+type+'"]').forEach(c=>{
   const name=(c.dataset.name||"").trim(), raw=c.querySelector(".volume").value.trim();
   if(name)comps.push({type,name,volume:raw});
  });
 });
 return comps;
}
function saveFavorite(){
 const comps=currentComponentsForFavorite();
 if(!comps.length){alert("Add at least one feed or medication before saving a favorite.");return}
 const missing=comps.filter(c=>c.volume===""||!Number.isFinite(Number(c.volume))||Number(c.volume)<=0);
 if(missing.length){alert("Enter a volume greater than 0 mL for every selected component before saving.");return}
 const name=prompt("Name this favorite:");
 if(name===null)return;
 const clean=name.trim();
 if(!clean){alert("Please enter a name for this favorite.");return}
 state.favorites.unshift({id:Date.now(),name:clean,components:comps});
 localStorage.setItem("eo_favorites",JSON.stringify(state.favorites));
 alert('Saved "'+clean+'" to Favorites.');
}
function renderFavorites(){
 const e=document.getElementById("favoriteList");
 if(!state.favorites.length){e.innerHTML='<div class="card empty">No favorites yet. Build a calculation, then tap “Save as favorite.”</div>';return}
 e.innerHTML=state.favorites.map((f,i)=>'<div class="card favcard"><div class="favtitle">☆ '+esc(f.name)+'</div>'+
  '<div class="small" style="margin-top:7px">'+f.components.map(c=>esc(c.name)+" ("+c.volume+" mL)").join(" · ")+'</div>'+
  '<div class="favactions"><button type="button" class="loadfav" data-fload="'+i+'">Load into Calculator</button><button type="button" class="deletefav" data-fdelete="'+i+'">Delete</button></div></div>').join("");
 e.querySelectorAll("[data-fload]").forEach(b=>b.addEventListener("click",()=>loadFavorite(Number(b.dataset.fload))));
 e.querySelectorAll("[data-fdelete]").forEach(b=>b.addEventListener("click",()=>deleteFavorite(Number(b.dataset.fdelete))));
}
function loadFavorite(i){
 const f=state.favorites[i];if(!f)return;
 const feeds=f.components.filter(c=>c.type==="feeds").map(c=>({name:c.name,volume:String(c.volume)}));
 const meds=f.components.filter(c=>c.type==="meds").map(c=>({name:c.name,volume:String(c.volume)}));
 state.feeds=feeds.length?feeds:[{}];state.meds=meds.length?meds:[{}];
 ["feeds","meds"].forEach(type=>{
  const host=document.getElementById(type);host.innerHTML="";
  state[type].forEach((saved,j)=>host.appendChild(makeComponent(type,j,saved)));addButton(type);
 });
 clearDisplayedResult();
 document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
 document.getElementById("calc").classList.add("active");
 document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.s==="calc"));
 window.scrollTo({top:0,behavior:"smooth"});
}
function deleteFavorite(i){
 const f=state.favorites[i];if(!f)return;
 if(!confirm('Delete favorite "'+f.name+'"?'))return;
 state.favorites.splice(i,1);
 localStorage.setItem("eo_favorites",JSON.stringify(state.favorites));
 renderFavorites();
}
let dbFilter="all";
function renderDB(){
 const q=document.getElementById("dbq").value.toLowerCase().trim();
 let rows=[];
 if(dbFilter==="all"||dbFilter==="feeds")rows.push(...DB.feeds.map(x=>({...x,type:"Feed"})));
 if(dbFilter==="all"||dbFilter==="medications")rows.push(...DB.medications.map(x=>({...x,type:"Medication"})));
 rows=rows.filter(x=>x.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
 document.getElementById("dbCount").textContent=rows.length+" "+(rows.length===1?"result":"results");
 document.getElementById("dbList").innerHTML=rows.length?rows.map(x=>
  '<div class="dbitem"><div class="dbname">'+esc(x.name)+'</div><div class="dbmeta"><span>'+x.type+'</span><span class="dbvalue">'+Number(x.osmolality).toFixed(1).replace(/\.0$/,"")+' mOsm/kg</span></div></div>'
 ).join(""):'<div class="empty" style="padding:18px 0">No matching database entries.</div>';
}
document.getElementById("dbq").addEventListener("input",renderDB);
document.querySelectorAll(".dbtab").forEach(b=>b.addEventListener("click",()=>{
 dbFilter=b.dataset.dbtype;
 document.querySelectorAll(".dbtab").forEach(x=>x.classList.toggle("active",x===b));
 renderDB();
}));
init();
</script>
</body>
</html>
